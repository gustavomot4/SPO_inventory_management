services:
  spo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spo-pimenta-ousada
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - spo_data:/data
    environment:
      DATABASE_URL: "file:/data/spo.db"
      # QA-060: SESSION_SECRET NÃO é mais fixado aqui. O docker-entrypoint.sh
      # gera um segredo aleatório por instalação e o persiste em /data/session_secret.
      # Versionar o segredo permitia forjar a sessão PIN (bypass de autenticação).
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || wget -qO- http://localhost:3000 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  spo-backup:
    image: alpine:3.19
    container_name: spo-backup
    restart: unless-stopped
    volumes:
      # Banco — rw exigido pela Online Backup API do SQLite p/ ler o WAL (-shm).
      # A Backup API (.backup) NAO altera os dados de origem (QA-075).
      - spo_data:/data
      # Pasta de backups na maquina da cliente
      - ./backups:/backups
      # Script de backup
      - ./docker-backup.sh:/backup.sh:ro
    command: >
      sh -c "
        (apk add --no-cache sqlite ||
          echo '[SPO Backup] AVISO: sem internet p/ instalar sqlite — backup em modo degradado (cp)') &&
        sed 's/\r$//' /backup.sh > /usr/local/bin/spo-backup.sh &&
        chmod +x /usr/local/bin/spo-backup.sh &&
        mkdir -p /backups &&
        echo '50 17 * * * /usr/local/bin/spo-backup.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root &&
        echo '[SPO Backup] Agendado para as 17h50 diariamente.' &&
        echo '[SPO Backup] Rodando backup de inicializacao...' &&
        (/usr/local/bin/spo-backup.sh ||
          echo '[SPO Backup] AVISO: backup de inicializacao falhou — proxima tentativa no cron das 17h50') &&
        crond -f -l 8
      "

volumes:
  spo_data:
    name: spo-pimenta-ousada-data
